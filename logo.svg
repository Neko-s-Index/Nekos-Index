    <line x1="22" y1="68" x2="34" y2="66" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
    <line x1="78" y1="62" x2="66" y2="64" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
    <line x1="78" y1="68" x2="66" y2="66" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
