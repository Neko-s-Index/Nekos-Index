<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nekoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="nekoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#nekoBg)" />
  <g filter="url(#nekoShadow)">
    <!-- Left ear -->
    <polygon points="24,48 34,18 46,48" fill="#0a0a0a" />
