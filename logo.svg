<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nekoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#nekoBg)"/>
  <g fill="#0a0a0a" shape-rendering="crispEdges">
    <!-- left ear -->
    <rect x="15" y="20" width="10" height="10"/>
    <rect x="15" y="30" width="20" height="10"/>
    <!-- right ear -->
    <rect x="75" y="20" width="10" height="10"/>
    <rect x="65" y="30" width="20" height="10"/>
    <!-- head -->
    <rect x="15" y="40" width="70" height="10"/>
    <rect x="15" y="50" width="70" height="10"/>
    <rect x="15" y="60" width="70" height="10"/>
  </g>
  <g fill="#ffffff" shape-rendering="crispEdges">
    <!-- eyes -->
    <rect x="25" y="50" width="10" height="10"/>
    <rect x="55" y="50" width="10" height="10"/>
  </g>
  <g fill="#0a0a0a" shape-rendering="crispEdges">
    <!-- pupils -->
    <rect x="28" y="53" width="4" height="4"/>
    <rect x="58" y="53" width="4" height="4"/>
  </g>
  <g fill="#f472b6" shape-rendering="crispEdges">
    <!-- nose -->
    <rect x="45" y="60" width="10" height="6"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round">
    <!-- whiskers -->
    <line x1="5" y1="55" x2="12" y2="55"/>
    <line x1="5" y1="65" x2="12" y2="65"/>
    <line x1="88" y1="55" x2="95" y2="55"/>
    <line x1="88" y1="65" x2="95" y2="65"/>
  </g>
</svg>
