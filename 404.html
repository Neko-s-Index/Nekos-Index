<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - Neko's Index</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', Arial, sans-serif;
        background: #0a0a0b;
        color: #ddd;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
    }
    .container {
        max-width: 500px;
        padding: 20px;
    }
    h1 {
        font-size: 6rem;
        margin: 0;
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    h2 {
        font-size: 1.5rem;
        color: #fff;
        margin-top: 10px;
    }
    p {
        color: #a1a1aa;
        margin: 20px 0;
    }
    a {
        display: inline-block;
        padding: 12px 24px;
        background: #3b82f6;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
    }
    a:hover {
        background: #2563eb;
    }
    footer {
        margin-top: 40px;
        color: #666;
        font-size: 13px;
    }
    .main-nav {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .main-nav a {
        color: #fff;
        background: #1c1c1f;
        border: 1px solid #27272a;
        padding: 10px 18px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        display: inline-block;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .main-nav a:hover {
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        border-color: transparent;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }

    .site-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        display: block;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35));
    }
</style>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="container">
    <img src="logo.svg" alt="Neko's Index" class="site-logo">
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="list.html">Index</a>
        <a href="guides.html">Guides</a>
        <a href="disclaimer.html">Disclaimer</a>
        <a href="dmca.html">DMCA</a>
        <a href="privacy.html">Privacy</a>
        <a href="notes.html">Notes</a>
    </nav>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you are looking for does not exist or may have moved.</p>
    <input type="text" id="search404" placeholder="Search the index..." style="padding: 12px 18px; border-radius: 8px; border: 1px solid #27272a; background: #141416; color: #fff; width: 100%; max-width: 300px; margin-bottom: 15px; font-size: 14px;">
    <br>
    <a href="list.html" id="goSearch">Search Index</a>
    <script>
        document.getElementById('goSearch').addEventListener('click', function(e) {
            const q = document.getElementById('search404').value.trim();
            if (q) {
                e.preventDefault();
                window.location.href = 'list.html?q=' + encodeURIComponent(q);
            }
        });
        document.getElementById('search404').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const q = this.value.trim();
                if (q) window.location.href = 'list.html?q=' + encodeURIComponent(q);
            }
        });
    </script>
    <a href="list.html">Go to Neko's Index</a>
</div>

<footer>
    &copy; 2026 Neko's Index.
    <a href="index.html" style="background: none; color: #666; padding: 0;">Home</a>
</footer>

<script>
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
    document.addEventListener('contextmenu', e => e.preventDefault());
    ['copy', 'cut', 'paste', 'dragstart'].forEach(evt =>
        document.addEventListener(evt, e => e.preventDefault())
    );
    document.addEventListener('keydown', e => {
        if (e.key === 'F12') return e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ['i','j','c','k','u'].includes(e.key.toLowerCase())) return e.preventDefault();
        if (e.ctrlKey && ['u','s','p'].includes(e.key.toLowerCase()) && !e.shiftKey) return e.preventDefault();
    });
</script>
</body>
</html>
